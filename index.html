<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Workout</title>
<style>
  :root{
    --bg: #121212;
    --surface: #1a1a1a;
    --border: #2a2a2a;
    --text: #f2f2f2;
    --text-dim: #9a9a9a;
    --accent: #e8e8e8;
    --warn: #d97b66;
    --done: #6ea88a;
    --muscle-primary: #c9534a;
    --muscle-secondary: #cf8a42;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:60px;
  }
  header{
    padding:24px 16px 12px;
    max-width:640px;
    margin:0 auto;
  }
  h1{
    font-size:15px;
    font-weight:600;
    letter-spacing:0.14em;
    color:var(--text-dim);
  }
  nav{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding:12px 16px 4px;
    max-width:640px;
    margin:0 auto;
    scrollbar-width:none;
  }
  nav::-webkit-scrollbar{display:none;}
  nav button{
    flex:0 0 auto;
    background:transparent;
    border:1px solid var(--border);
    color:var(--text-dim);
    padding:8px 14px;
    border-radius:8px;
    font-size:14px;
    font-weight:500;
    cursor:pointer;
  }
  nav button.active{
    background:var(--accent);
    color:#111;
    border-color:var(--accent);
  }
  main{
    max-width:640px;
    margin:0 auto;
    padding:12px 16px 40px;
  }
  .warmup{
    border:1px solid var(--border);
    border-radius:10px;
    padding:14px 16px;
    margin-bottom:18px;
  }
  .warmup h2{
    font-size:12px;
    text-transform:none;
    color:var(--text-dim);
    font-weight:600;
    margin-bottom:8px;
  }
  .warmup ul{list-style:none;}
  .warmup li{
    font-size:14px;
    color:var(--text);
    padding:2px 0;
    display:flex;
    justify-content:space-between;
  }
  .warmup li span:last-child{color:var(--text-dim);}

  .muscle-map{
    display:flex;
    justify-content:center;
    gap:28px;
    padding:10px 0 8px;
  }
  .muscle-map figure{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
  }
  .muscle-map svg{
    width:78px;
    height:auto;
    display:block;
  }
  .muscle-map figcaption{
    font-size:10px;
    letter-spacing:0.04em;
    color:var(--text-dim);
  }
  .muscle-map .body-base{
    fill:var(--border);
  }
  .muscle-map .muscle-primary{
    fill:var(--muscle-primary);
    fill-opacity:0.85;
  }
  .muscle-map .muscle-secondary{
    fill:var(--muscle-secondary);
    fill-opacity:0.8;
  }
  .muscle-legend{
    display:flex;
    justify-content:center;
    gap:18px;
    font-size:11px;
    color:var(--text-dim);
    padding-bottom:18px;
  }
  .muscle-legend span{
    display:inline-flex;
    align-items:center;
    gap:5px;
  }
  .muscle-legend .dot{
    width:8px;
    height:8px;
    border-radius:50%;
    display:inline-block;
  }
  .muscle-legend .dot.primary{background:var(--muscle-primary);}
  .muscle-legend .dot.secondary{background:var(--muscle-secondary);}

  .exercise{
    border-bottom:1px solid var(--border);
    padding:16px 0;
  }
  .exercise:last-child{border-bottom:none;}
  .ex-name{
    font-size:17px;
    font-weight:600;
  }
  .ex-target{
    font-size:13px;
    color:var(--text-dim);
    margin-top:2px;
  }
  .ex-meta{
    display:flex;
    gap:14px;
    margin-top:8px;
    font-size:14px;
    color:var(--text);
  }
  .ex-meta .rest-label{color:var(--text-dim);}
  .ex-actions{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:12px;
  }
  .btn{
    border:1px solid var(--border);
    background:transparent;
    color:var(--text);
    padding:8px 12px;
    border-radius:8px;
    font-size:13px;
    font-weight:500;
    cursor:pointer;
  }
  .btn:hover{border-color:#444;}
  .btn.link{
    color:var(--text-dim);
  }
  .btn.link:hover{color:var(--text);}
  .timer{
    display:none;
    align-items:center;
    gap:10px;
    margin-top:10px;
    padding:10px 12px;
    border-radius:8px;
    background:var(--surface);
  }
  .timer.show{display:flex;}
  .timer .time{
    font-variant-numeric: tabular-nums;
    font-size:20px;
    font-weight:600;
    min-width:56px;
  }
  .timer.finished .time{color:var(--warn);}
  .timer .small-btn{
    border:1px solid var(--border);
    background:transparent;
    color:var(--text-dim);
    padding:6px 10px;
    border-radius:6px;
    font-size:12px;
    cursor:pointer;
  }
  .timer .small-btn:hover{color:var(--text);}
</style>
</head>
<body>

const DAY_ORDER = ["Sunday", "Monday", "Tuesday", "Wednesday", "Saturday"];

// ---------------------------------------------------------------
// MUSCLE DIAGRAM — simple body skeleton + muscle group overlays
// ---------------------------------------------------------------

// base body skeleton, shared by front and back figures

  <rect class="body-base" x="52" y="150" width="12" height="45" rx="6"/>
`;

// muscle group overlays, keyed by muscle name, per view
const FRONT_MUSCLES = {

// which muscles to highlight per day, split by view and by training intensity
const DAY_MUSCLES = {
  Sunday: {
    front: { primary: ["chest", "biceps", "forearms"], secondary: ["frontDelts"] },
    back:  { primary: ["lats", "traps", "forearms"],  secondary: ["rearDelts", "triceps"] }
  },
  Monday: {
    front: { primary: ["quads", "abs"], secondary: ["calves"] },
    back:  { primary: ["hamstrings", "glutes"], secondary: ["calves"] }
  },
  Tuesday: {

    back:  { primary: ["triceps"], secondary: [] }
  },
  Wednesday: {
    front: { primary: ["biceps", "forearms"], secondary: ["brachialis"] },
    back:  { primary: ["lats", "midBack", "traps", "forearms"], secondary: ["rearDelts"] }
  },
  Saturday: {
    front: { primary: ["quads", "abs"], secondary: ["calves"] },
    back:  { primary: ["hamstrings", "glutes"], secondary: ["calves"] }
  }

function renderFigureSVG(muscleSet, view){
  const primaryOverlays = view.primary
    .filter(key => muscleSet[key])
    .map(key => `<g class="muscle-primary">${muscleSet[key]}</g>`)
    .join("");
  const secondaryOverlays = view.secondary
    .filter(key => muscleSet[key])
    .map(key => `<g class="muscle-secondary">${muscleSet[key]}</g>`)
    .join("");
  return `<svg viewBox="0 0 100 200">${BODY_BASE_SVG}${secondaryOverlays}${primaryOverlays}</svg>`;
}

function renderMuscleMap(day){
  const highlights = DAY_MUSCLES[day];
  const wrap = document.createElement("div");
  wrap.innerHTML = `
    <div class="muscle-map">
      <figure>${renderFigureSVG(FRONT_MUSCLES, highlights.front)}<figcaption>Front</figcaption></figure>
      <figure>${renderFigureSVG(BACK_MUSCLES, highlights.back)}<figcaption>Back</figcaption></figure>
    </div>
    <div class="muscle-legend">
      <span><span class="dot primary"></span>Primary</span>
      <span><span class="dot secondary"></span>Secondary</span>
    </div>
  `;
  return wrap;
}

const navEl = document.getElementById("dayNav");
const contentEl = document.getElementById("content");
let activeDay = DAY_ORDER[0];
const timers = {}; // per-exercise timer state, keyed by "day-index"

function formatTime(sec){
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return m + ":" + String(s).padStart(2, "0");
}

function buildNav(){
  navEl.innerHTML = "";
  DAY_ORDER.forEach(day => {
    const btn = document.createElement("button");
    btn.textContent = day;
    btn.className = day === activeDay ? "active" : "";
    btn.addEventListener("click", () => {
      activeDay = day;
      buildNav();
      renderDay();
    });
    navEl.appendChild(btn);
  });
}

function renderDay(){
  const day = WORKOUTS[activeDay];
  contentEl.innerHTML = "";

  // Muscle diagram
  contentEl.appendChild(renderMuscleMap(activeDay));

  // Warm-up
  const warmupEl = document.createElement("section");
  warmupEl.className = "warmup";
  warmupEl.innerHTML = `<h2>Warm-up</h2><ul>${
    day.warmup.map(w => `<li><span>${w.name}</span><span>${w.duration}</span></li>`).join("")
  }</ul>`;
  contentEl.appendChild(warmupEl);

  // Exercises
  day.exercises.forEach((ex, i) => {
    const key = activeDay + "-" + i;
    const card = document.createElement("div");
    card.className = "exercise";
    card.innerHTML = `
      <div class="ex-name">${ex.name}</div>
      <div class="ex-target">${ex.target}</div>
      <div class="ex-meta">
        <span>${ex.sets} sets × ${ex.reps} reps</span>
        <span class="rest-label">Rest: ${ex.restDisplay}</span>
      </div>
      <div class="ex-actions">
        <button class="btn" data-action="rest">Start Rest</button>
        <a class="btn link" href="${ex.video}" target="_blank" rel="noopener noreferrer">Watch Exercise ↗</a>
      </div>
      <div class="timer" id="timer-${key}">
        <span class="time" id="time-${key}">${formatTime(ex.restSeconds)}</span>
        <button class="small-btn" data-action="pause">Pause</button>
        <button class="small-btn" data-action="reset">Reset</button>
      </div>
    `;
    contentEl.appendChild(card);

    const restBtn = card.querySelector('[data-action="rest"]');
    const pauseBtn = card.querySelector('[data-action="pause"]');
    const resetBtn = card.querySelector('[data-action="reset"]');
    const timerEl = card.querySelector(`#timer-${key}`);
    const timeEl = card.querySelector(`#time-${key}`);

    restBtn.addEventListener("click", () => startTimer(key, ex.restSeconds, timerEl, timeEl, pauseBtn));
    pauseBtn.addEventListener("click", () => togglePause(key, pauseBtn));
    resetBtn.addEventListener("click", () => resetTimer(key, ex.restSeconds, timerEl, timeEl, pauseBtn));
  });
}

function startTimer(key, totalSeconds, timerEl, timeEl, pauseBtn){
  // clear existing interval for this exercise if any
  if (timers[key] && timers[key].interval) clearInterval(timers[key].interval);

  timers[key] = {
    remaining: totalSeconds,
    paused: false,
    interval: null
  };
  timerEl.classList.add("show");
  timerEl.classList.remove("finished");
  pauseBtn.textContent = "Pause";
  timeEl.textContent = formatTime(totalSeconds);

  timers[key].interval = setInterval(() => {
    const t = timers[key];
    if (t.paused) return;
    t.remaining--;
    if (t.remaining <= 0){
      t.remaining = 0;
      timeEl.textContent = "Rest finished";
      timerEl.classList.add("finished");
      clearInterval(t.interval);
    } else {
      timeEl.textContent = formatTime(t.remaining);
    }
  }, 1000);
}

function togglePause(key, pauseBtn){
  const t = timers[key];
  if (!t) return;
  t.paused = !t.paused;
  pauseBtn.textContent = t.paused ? "Resume" : "Pause";
}

function resetTimer(key, totalSeconds, timerEl, timeEl, pauseBtn){
  const t = timers[key];
  if (t && t.interval) clearInterval(t.interval);
  timers[key] = { remaining: totalSeconds, paused: false, interval: null };
  timeEl.textContent = formatTime(totalSeconds);
  timerEl.classList.remove("finished");
  pauseBtn.textContent = "Pause";
}

buildNav();
renderDay();
</script>
